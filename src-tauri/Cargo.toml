[package]
name = "llm-canary"
version = "0.3.0"
description = "Get answers about where a model's training came from — cited public vs private provenance for sources you watch."
authors = ["Aaron Grace <aarongrace978@gmail.com>"]
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "llm_canary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
